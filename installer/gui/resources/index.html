<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>ARKlight Installer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="neutralinoapp">
      <h1>ARKlight Installer — Stage 2</h1>
      <p>Plain scaffolding. No styling yet — that's Stage 4.</p>

      <div id="state-panel">Checking install state…</div>

      <div id="install-panel" hidden>
        <h2>Install</h2>
        <div id="connectivity-status"></div>
        <div id="python-choices"></div>
        <pre id="install-log">(no install started)</pre>
      </div>

      <div id="maintenance-panel" hidden>
        <h2>Maintenance</h2>
        <p id="maintenance-summary"></p>
        <button id="btn-update" onclick="update();">Update</button>
        <button id="btn-repair" onclick="repair();">Repair</button>
        <button id="btn-uninstall" onclick="confirmUninstall();">Uninstall</button>
        <div id="repair-status"></div>
        <div id="uninstall-confirm" hidden>
          <p>This removes ARKlight and its file associations. Continue?</p>
          <button onclick="doUninstall();">Yes, uninstall</button>
          <button onclick="document.getElementById('uninstall-confirm').hidden = true;">Cancel</button>
        </div>
        <pre id="maintenance-log">(no action taken)</pre>
      </div>
    </div>
    <!-- Neutralino.js client. This file is gitignored, 
        because `neu update` typically downloads it.
        Avoid copy-pasting it. 
        -->
    <script src="/js/neutralino.js"></script>
    <!-- Your app's source files -->
    <script src="/js/main.js"></script>
  </body>
</html>
