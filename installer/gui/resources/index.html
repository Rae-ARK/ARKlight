<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>ARKlight Installer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app">
      <aside id="rail">
        <div id="brand">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="13" cy="13" r="4" fill="var(--beacon)"/>
            <g stroke="var(--beacon)" stroke-width="1.6" stroke-linecap="round">
              <line x1="13" y1="2" x2="13" y2="5.5"/>
              <line x1="13" y1="20.5" x2="13" y2="24"/>
              <line x1="2" y1="13" x2="5.5" y2="13"/>
              <line x1="20.5" y1="13" x2="24" y2="13"/>
              <line x1="4.9" y1="4.9" x2="7.3" y2="7.3"/>
              <line x1="18.7" y1="18.7" x2="21.1" y2="21.1"/>
              <line x1="21.1" y1="4.9" x2="18.7" y2="7.3"/>
              <line x1="7.3" y1="18.7" x2="4.9" y2="21.1"/>
            </g>
          </svg>
          <div>
            <div id="brand-name">ARKlight</div>
            <span id="brand-tag">installer</span>
          </div>
        </div>

        <nav id="beam" aria-label="Progress"></nav>

        <div id="rail-footer">
          <span id="mode-label" class="mono" style="color: var(--rail-text-muted); font-size: 11px;"></span>
          <button id="theme-toggle" type="button" aria-label="Toggle color theme" onclick="toggleTheme();" title="Toggle theme">
            <svg id="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </aside>

      <main id="content" aria-live="polite"></main>
    </div>

    <!-- Neutralino.js client. This file is gitignored,
        because `neu update` typically downloads it.
        Avoid copy-pasting it.
        -->
    <script src="/js/neutralino.js"></script>
    <!-- Your app's source files -->
    <script src="/js/main.js"></script>
  </body>
</html>
