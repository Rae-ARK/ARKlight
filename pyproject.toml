[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arklight"
version = "0.0035"
description = "A Python-first compiler for building beautiful static websites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ARKlight" }]

[project.scripts]
arklight = "arklight.cli.main:main"

[tool.setuptools.packages.find]
include = ["arklight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
