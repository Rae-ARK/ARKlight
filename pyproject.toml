[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arklight"
version = "0.42.0"
description = "A Python-first compiler for building beautiful static websites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ARKlight" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.scripts]
arklight = "arklight.cli.main:main"

[tool.setuptools.packages.find]
include = ["arklight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
