name: Installer build

on:
  push:
    branches: [installer]
    paths:
      - 'installer/gui/**'
      - 'installer/CMakeLists.txt'
      - 'installer/packaging/**'
      - 'installer/linux/**'
      - '.github/workflows/installer-build.yml'
    tags:
      - 'installer-v*'
  pull_request:
    paths:
      - 'installer/gui/**'
      - 'installer/CMakeLists.txt'
      - 'installer/packaging/**'
      - 'installer/linux/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install neu CLI
        run: npm install -g @neutralinojs/neu
      - name: Fetch neutralino binaries/client
        working-directory: installer/gui
        run: neu update
      - name: Build
        working-directory: installer/gui
        run: neu build

      # --- Stage 3: CPack packaging per OS ---

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake rpm
      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool
      - name: Install packaging tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # CPack's WIX generator only drives WiX v3's candle.exe/light.exe.
          # windows-latest already ships WiX v3 preinstalled, but NOT via
          # Chocolatey, so `choco install wixtoolset` doesn't recognize it
          # as already present and collides with the existing Windows
          # Installer registration, failing this step outright. Reuse the
          # preinstalled candle.exe if it's already on PATH or in one of
          # its known install locations, and only fall back to choco (pinned
          # to the v3 line CPack expects — v4+'s dotnet-based wix.exe won't
          # work) if no v3 toolset can be found at all.
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($candle) {
            Write-Host "Found preinstalled WiX v3 at $($candle.Source)"
            Split-Path $candle.Source | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            $knownDirs = @(
              "$env:WIX" + "bin",
              "C:\Program Files (x86)\WiX Toolset v3.14\bin",
              "C:\Program Files (x86)\WiX Toolset v3.11\bin"
            )
            $found = $knownDirs | Where-Object { $_ -and (Test-Path (Join-Path $_ 'candle.exe')) } | Select-Object -First 1
            if ($found) {
              Write-Host "Found preinstalled WiX v3 at $found"
              echo $found | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              Write-Host "No preinstalled WiX v3 found, installing via choco"
              choco install wixtoolset --version=3.14.1 -y --no-progress
              $wixBin = "$env:WIX" + "bin"
              if (Test-Path $wixBin) {
                echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              } else {
                echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }

      - name: Configure (CMake)
        working-directory: installer
        run: cmake -S . -B build
      - name: Package (.deb / .rpm / .msi / .dmg+.pkg)
        working-directory: installer/build
        run: cpack -C Release
      - name: Package AppImage (Linux only)
        if: runner.os == 'Linux'
        working-directory: installer/build
        run: cmake --build . --target appimage

      - name: Sanity install (Linux, .deb)
        if: runner.os == 'Linux'
        working-directory: installer/build
        run: |
          sudo dpkg -i arklight-installer_*_amd64.deb
          command -v arklight-installer
          # Headless CI runner: expect a display-connection failure, not
          # "command not found" — that's what actually validates the
          # package wired the binary + resources.neu correctly.
          arklight-installer || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arklight-installer-${{ runner.os }}
          path: |
            installer/build/*.deb
            installer/build/*.rpm
            installer/build/*.AppImage
            installer/build/*.msi
            installer/build/*.dmg
            installer/build/*.pkg
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/installer-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/build/*.deb
            installer/build/*.rpm
            installer/build/*.AppImage
            installer/build/*.msi
            installer/build/*.dmg
            installer/build/*.pkg
