name: Installer build

on:
  push:
    branches: [installer]
    paths:
      - 'installer/gui/**'
      - 'installer/CMakeLists.txt'
      - 'installer/packaging/**'
      - 'installer/linux/**'
      - '.github/workflows/installer-build.yml'
    tags:
      - 'installer-v*'
  pull_request:
    paths:
      - 'installer/gui/**'
      - 'installer/CMakeLists.txt'
      - 'installer/packaging/**'
      - 'installer/linux/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install neu CLI
        run: npm install -g @neutralinojs/neu
      - name: Fetch neutralino binaries/client
        working-directory: installer/gui
        run: neu update
      - name: Build
        working-directory: installer/gui
        run: neu build

      # --- Stage 3: CPack packaging per OS ---

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake rpm
      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool
      - name: Install packaging tools (Windows)
        if: runner.os == 'Windows'
        run: |
          # CPack's WIX generator only drives WiX v3's candle.exe/light.exe.
          # An unpinned `choco install wixtoolset` pulls the latest WiX
          # (v4/v5, dotnet-based wix.exe) and overwrites the v3 toolset that
          # windows-latest ships preinstalled, which breaks `cpack -C Release`
          # with "candle.exe not found". Pin to the v3 line CPack expects.
          choco install wixtoolset --version=3.14.1 -y --no-progress
          $wixBin = "${env:WIX}bin"
          if (Test-Path $wixBin) {
            echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Configure (CMake)
        working-directory: installer
        run: cmake -S . -B build
      - name: Package (.deb / .rpm / .msi / .dmg+.pkg)
        working-directory: installer/build
        run: cpack -C Release
      - name: Package AppImage (Linux only)
        if: runner.os == 'Linux'
        working-directory: installer/build
        run: cmake --build . --target appimage

      - name: Sanity install (Linux, .deb)
        if: runner.os == 'Linux'
        working-directory: installer/build
        run: |
          sudo dpkg -i arklight-installer_*_amd64.deb
          command -v arklight-installer
          # Headless CI runner: expect a display-connection failure, not
          # "command not found" — that's what actually validates the
          # package wired the binary + resources.neu correctly.
          arklight-installer || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arklight-installer-${{ runner.os }}
          path: |
            installer/build/*.deb
            installer/build/*.rpm
            installer/build/*.AppImage
            installer/build/*.msi
            installer/build/*.dmg
            installer/build/*.pkg
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/installer-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/build/*.deb
            installer/build/*.rpm
            installer/build/*.AppImage
            installer/build/*.msi
            installer/build/*.dmg
            installer/build/*.pkg
