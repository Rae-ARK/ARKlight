name: Linux Installer

# Builds the ARKlight Installer GUI for Linux and packages it as .deb,
# .rpm, and AppImage from a single shared Python codebase
# (installer/gui/arklight_installer/). See installer/README.md and
# installer/linux/build.sh for the underlying design.

on:
  push:
    branches: [installer]
    paths:
      - "installer/**"
      - ".github/workflows/installer-linux.yml"
  pull_request:
    paths:
      - "installer/**"
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk tk-dev dpkg-dev rpm fuse libfuse2

      - name: Install appimagetool
        run: |
          case "${{ matrix.arch }}" in
            x86_64) AI_ARCH="x86_64" ;;
            aarch64) AI_ARCH="aarch64" ;;
          esac
          curl -L -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${AI_ARCH}.AppImage"
          chmod +x /usr/local/bin/appimagetool

      - name: Build .deb, .rpm, and AppImage
        run: bash installer/linux/build.sh all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arklight-installer-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
